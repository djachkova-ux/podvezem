<!--
  «Подвезём» — иконка под маску (purpose "maskable" в манифесте, а также apple-touch-icon).
  Отличается от app-icon.svg только одним: фон полнокадровый, без скругления, —
  форму задаёт сама система (круг, сквиркл, капля), поэтому скруглять здесь нельзя.

  Знак вписан в габарит 274×274 по центру: его диагональ 388 px укладывается
  в safe zone Android (круг диаметром 80 % от стороны — 410 px), так что при любой
  маске дорога не обрежется. Если менять рисунок — проверить это условие заново.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A6E55" />
      <stop offset="1" stop-color="#123528" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)" />

  <path
    d="M150 362L300 362A53 53 0 0 0 300 256L212 256A53 53 0 0 1 212 150L362 150"
    fill="none" stroke="#F6ECD9" stroke-width="62" stroke-linecap="round"
  />
  <path
    d="M150 362L300 362A53 53 0 0 0 300 256L212 256A53 53 0 0 1 212 150L362 150"
    fill="none" stroke="#B8912A" stroke-width="7" stroke-linecap="round" stroke-dasharray="18 24"
  />
  <circle cx="150" cy="362" r="17" fill="#B8912A" />
  <circle cx="362" cy="150" r="17" fill="#B8912A" />
</svg>
