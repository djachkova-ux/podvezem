<!--
  «Подвезём» — иконка приложения (S13). Мастер-файл, из него нарезаны все PNG в public/.
  Мотив: маршрут-лента в форме буквы «П» — путь до школы, латунная точка — прибытие.
  Палитра «Хвоя»: фон — тройной хвойный градиент, полотно — тёплый крем, точка/пунктир — латунь.

  Этот вариант со скруглением 116 (22.7 %) — для обычных иконок (purpose "any"),
  apple-touch-icon и favicon. Полнокадровый вариант под маску Android — app-icon-maskable.svg.

  Знак вписан в область 384×384 по центру (отступ 64 с каждой стороны от канвы 512).
  Диагональ его bounding box (с учётом толщины линии) — около 391 px, укладывается
  в safe zone Android (круг 410 px). При правке рисунка — проверить условие заново.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0.29" y1="0.05" x2="0.71" y2="0.95">
      <stop offset="0%" stop-color="#2E7A5E" />
      <stop offset="45%" stop-color="#1F5140" />
      <stop offset="100%" stop-color="#0E2A1F" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#bg)" />

  <svg x="64" y="64" width="384" height="384" viewBox="0 0 64 64">
    <!-- полотно маршрута -->
    <path d="M17 51 L17 21 Q17 15 23 15 L41 15 Q47 15 47 21 L47 51"
          fill="none" stroke="#F2F7F2" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" />
    <!-- осевая разметка -->
    <path d="M17 51 L17 21 Q17 15 23 15 L41 15 Q47 15 47 21 L47 51"
          fill="none" stroke="#B8912A" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 6" />
    <!-- точка прибытия -->
    <circle cx="47" cy="51" r="5.5" fill="#B8912A" />
  </svg>
</svg>
